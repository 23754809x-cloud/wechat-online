name: Full regression audit

on:
  push:
    branches:
      - chatgpt/full-regression-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record upstream Biome debt
        continue-on-error: true
        run: pnpm check

      - name: Translation audit
        run: node packages/web/scripts/i18n-audit.mjs

      - name: Static runtime audit
        working-directory: packages/web
        run: node scripts/static-runtime-audit.mjs

      - name: Production build
        run: pnpm build

      - name: Install ephemeral Playwright runtime
        working-directory: packages/web
        run: |
          pnpm add --save-dev --lockfile=false playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start production preview
        working-directory: packages/web
        run: |
          nohup pnpm preview --host 127.0.0.1 --port 4173 > /tmp/wechat-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/wechat-online/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wechat-preview.log
          exit 1

      - name: Mobile 430x932 smoke test
        working-directory: packages/web
        env:
          APP_URL: http://127.0.0.1:4173/wechat-online/
          TEST_OUTPUT: test-results/mobile
        run: node scripts/mobile-smoke.mjs

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-artifacts
          path: |
            packages/web/test-results/mobile
            packages/web/test-results/static-runtime-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload source audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-snapshot
          path: |
            packages/web/src
            packages/web/scripts
            packages/web/package.json
            packages/web/vite.config.ts
            package.json
            pnpm-workspace.yaml
          if-no-files-found: error
          retention-days: 2
